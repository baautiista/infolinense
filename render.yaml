services:
  - type: web
    name: infolinense-desk-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_WEB_SEARCH
        value: "true"
      - key: AUTO_PIPELINE
        value: "true"
