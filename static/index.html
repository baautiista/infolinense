<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0150FE">
<title>InfoLinense Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css?v=3.2">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="logo">IL</div>
    <h1>InfoLinense Desk</h1>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="loginError" class="error" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <button class="back" id="backBtn" hidden aria-label="Volver">‹</button>
    <h1 id="title">Noticias</h1>
    <button class="btn primary small" id="scanBtn">Buscar noticias</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Secciones">
    <button data-view="news" class="on"><span class="ico">◎</span>Noticias</button>
    <button data-view="social"><span class="ico">✆</span>Redes</button>
    <button data-view="agenda"><span class="ico">◷</span>Agenda</button>
    <button data-view="drafts"><span class="ico">✎</span>Redacción</button>
    <button data-view="settings"><span class="ico">⚙</span>Ajustes</button>
  </nav>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/app.js?v=3.2"></script>
</body>
</html>
